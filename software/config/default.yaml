camera:
  index: 1
  # 后端：msmf | dshow | any
  #   msmf  : Windows Media Foundation，支持 MJPG 压缩流，1080p 可达约 30fps
  #   dshow : DirectShow，锁曝光最稳，但常只能跑未压缩 YUY2，1080p 仅约 5fps
  backend: msmf
  width: 1920
  height: 1080
  # 像素格式：MJPG 走压缩、带宽小、帧率高；YUY2 未压缩、帧率低
  fourcc: MJPG
  # 目标帧率（0 表示不设置）
  fps: 30
  auto_exposure: false
  exposure: -6
  gain: 0
  auto_wb: false
  # 抓图时丢弃的帧数（仅 grab() 用；实时取景用 read() 不丢弃）
  discard_frames: 3
turntable:
  port: COM9
  baudrate: 115200
  steps_per_rev: 200
  microstep: 32
  gear_ratio: 5.18
  settle_ms: 200
  timeout_s: 5.0
scan:
  angle_step_deg: 2.0
  num_views: 180
  timeout_s: 60
calibration:
  camera_file: software/config/calib_camera.npz
  laser_file: software/config/calib_laser.npz
  axis_file: software/config/calib_axis.npz
camera_calib:
  # 棋盘格**内角点**列数 / 行数（不是方格数！）
  # 常用打印板：内角点 9x6（对应方格 10x7）、11x8 等，
  # 必须与实物一致，否则永远检测不到。
  pattern_cols: 9
  pattern_rows: 6
  # 单个方格边长（米）
  square_size_m: 0.01
  images_glob: assets/calibration_targets/chessboard/*.png
axis_calib:
  sphere_radius_m: 0.02
  method: peak
  num_views: 12
  step_deg: 30.0
  min_views: 3
  settle_ms: 250
  spot_threshold: 60.0
  spot_win_px: 25
  min_radius_px: 8.0
  max_radius_px: 240.0
  archive_dir: data/calibration/axis
laser:
  wavelength_nm: 650
  power_mw: 1.0
  safety_class: 2
extraction:
  method: steger
  threshold: 60.0
  smooth_sigma: 1.5
  steger_sigma: 1.5
  min_pixels: 1
  min_points: 50
  invert: false
  roi: null
reconstruction:
  voxel_size: 0.0005
  icp_refine: true
  poisson_depth: 9
  density_quantile: 0.02
volume:
  method: divergence
  voxel_pitch: 0.001
  cross_check: true
  unit: cm3
output:
  raw_dir: data/raw
  pointcloud_dir: data/pointclouds
  mesh_dir: data/meshes
  result_dir: data/results
  calib_dir: data/calibration
  log_dir: logs
logging:
  level: INFO
