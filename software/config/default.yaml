camera:
  index: 1
  backend: dshow
  width: 1280
  height: 800
  fourcc: MJPG
  fourcc_mono: Y800
  mono: true
  fps: 10
  auto_exposure: false
  exposure: -8
  gain: 100
  auto_wb: false
  discard_frames: 3
turntable:
  port: COM9
  baudrate: 115200
  steps_per_rev: 200
  microstep: 32
  gear_ratio: 5.18
  settle_ms: 1000
  timeout_s: 5.0
scan:
  preset: null
  angle_step_deg: 1.0
  num_views: 360
  timeout_s: 120
  steps_per_view: 92
calibration:
  camera_file: software/config/calib_camera.npz
  laser_file: software/config/calib_laser.npz
  axis_file: software/config/calib_axis.npz
  axis_mode: calibrated
  z_axis_point:
  - 0.0
  - 0.0
  - 0.0
  z_axis_dir:
  - 0.0
  - 0.0
  - 1.0
  strict: false
camera_calib:
  pattern_cols: 11
  pattern_rows: 8
  square_size_m: 0.01
  images_glob: assets/calibration_targets/chessboard/*.png
  use_sb: true
  auto_prune: true
  min_images_for_pruning: 8
axis_calib:
  sphere_radius_m: 0.02
  method: depth
  save_images: true
  num_views: 24
  step_deg: 30.0
  min_views: 6
  max_residual_mm: 1.0
  min_radius_mm: 2.0
  settle_ms: 2000
  spot_threshold: 40.0
  spot_win_px: 25
  spot_channel: red_laser
  min_radius_px: 8.0
  max_radius_px: 240.0
  robust: true
  archive_dir: data/calibration/axis
laser_calib:
  robust: true
  robust_method: irls
  view_reject_mm: 1.0
  outlier_mm: 0.5
  save_images: true
  clip_margin_px: 0.0
  channel: gray
laser:
  wavelength_nm: 650
  power_mw: 1.0
  safety_class: 2
quality:
  camera_rms_good: 0.3
  camera_rms_warn: 0.5
  laser_rms_good: 0.3
  laser_rms_warn: 0.5
  axis_rms_good: 0.1
  axis_rms_warn: 0.3
extraction:
  method: row_peak
  threshold: 60.0
  smooth_sigma: 1.5
  subpixel: true
  steger_sigma: 1.5
  steger_merge: normal
  steger_min_sep_px: 1.0
  min_pixels: 1
  min_points: 50
  invert: false
  roi: null
  channel: red_laser
  enhance_enable: true
  enhance_threshold: 60.0
  enhance_blur_ksize: 5
  enhance_window: 9
  enhance_window_enable: true
  enhance_double_threshold_enable: true
  enhance_scale_to_width: true
  enhance_min_peak: 0.0
reconstruction:
  filter_chain:
  - name: depth
  - name: bounds
    enable: false
  - name: cluster
  - name: turntable
    method: axis_height
  - name: axial
    auto_trim: true
  voxel_size: 0.0005
  icp_refine: false
  global_align: false
  pose_graph: false
  edge_span: 3
  iterative_iters: 3
  depth_filter: true
  depth_min_m: 0.0
  depth_max_m: 0.3
  bounds_radius_m: 0.0
  cluster_filter: true
  cluster_eps_m: 0.002
  cluster_min_points: 10
  cluster_keep_top: 1
  bounds_z_min_m: null
  bounds_z_max_m: null
  poisson_depth: 9
  adaptive_depth: true
  orient_max_nn: 30
  density_quantile: 0.02
  close_fallback: bottom_plane
  allow_convex_hull: true
  remove_turntable: true
  turntable_method: axis_height
  turntable_height_m: null
  turntable_plane_tol_m: 0.001
  turntable_min_inlier: 0.15
  turntable_align_tol_deg: 15.0
  turntable_margin_m: 0.0005
  turntable_band_below_m: 0.0015
  turntable_keep_upper_only: true
  turntable_radius_m: null
  axial:
    auto_trim: true
    height_min_m: null
    height_max_m: null
    radius_max_m: null
volume:
  method: divergence
  voxel_pitch: 0.001
  cross_check: true
  unit: cm3
output:
  raw_dir: data/raw
  pointcloud_dir: data/pointclouds
  mesh_dir: data/meshes
  result_dir: data/results
  calib_dir: data/calibration
  log_dir: logs
logging:
  level: INFO
