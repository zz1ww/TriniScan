# TriniScan 默认配置
# 单位约定：长度 m，角度 度，时间 s（除特别说明）

# ---------------------------------------------------------------------------
camera:
  index: 0
  backend: "dshow"          # Windows: dshow | 其他平台: any
  width: 1920
  height: 1080
  auto_exposure: false      # 必须锁定曝光
  exposure: -6              # 依相机而定，需实测标定
  gain: 0
  auto_wb: false            # 必须锁定白平衡
  discard_frames: 3         # 每次抓图前丢弃的帧数（等曝光稳定）

# ---------------------------------------------------------------------------
turntable:
  port: "COM3"
  baudrate: 115200
  steps_per_rev: 200        # 电机整步/圈（1.8° 步距角）
  microstep: 32             # 驱动器细分
  gear_ratio: 5.0           # 机械减速比
  settle_ms: 200            # 到位稳定延时
  timeout_s: 5.0            # 单条指令超时

# ---------------------------------------------------------------------------
scan:
  angle_step_deg: 2.0       # 每视角转过的角度
  num_views: 180            # 视角数 = 360 / angle_step_deg
  timeout_s: 60             # 单件测量总时限

# ---------------------------------------------------------------------------
calibration:
  camera_file: "software/config/calib_camera.npz"
  laser_file: "software/config/calib_laser.npz"
  axis_file: "software/config/calib_axis.npz"

camera_calib:
  pattern_cols: 9           # 棋盘格内角点数（列）
  pattern_rows: 6           # 棋盘格内角点数（行）
  square_size_m: 0.020      # 方格实际尺寸 (m)
  images_glob: "assets/calibration_targets/chessboard/*.png"

# ---------------------------------------------------------------------------
laser:
  wavelength_nm: 650
  power_mw: 1.0
  safety_class: 2           # 安全等级标注（需在装置上标明）

# ---------------------------------------------------------------------------
# 中心线提取
extraction:
  method: "steger"          # steger | gray_centroid | peak
  threshold: 60.0           # 激光亮度阈值（绝对灰度）
  smooth_sigma: 1.5         # 预处理高斯平滑
  steger_sigma: 1.5         # Steger 微分尺度
  min_pixels: 1             # 每列视为有效条纹的最少像素
  min_points: 50            # 每视角有效点的下限
  invert: false             # 亮背景上的暗线请设 true
  roi: null                 # [x, y, w, h] 或 null（全图）

# ---------------------------------------------------------------------------
reconstruction:
  voxel_size: 0.0005        # 下采样/配准体素 (m)
  icp_refine: true          # 相邻视角 ICP 精配准
  poisson_depth: 9          # Poisson 八叉树深度
  density_quantile: 0.02    # 裁剪最低密度面片的分位

# ---------------------------------------------------------------------------
volume:
  method: "divergence"      # divergence | voxel
  voxel_pitch: 0.001        # 体素法校核体素尺寸 (m)
  cross_check: true         # 散度定理后用体素法校核
  unit: "cm3"

# ---------------------------------------------------------------------------
output:
  raw_dir: "data/raw"
  pointcloud_dir: "data/pointclouds"
  mesh_dir: "data/meshes"
  result_dir: "data/results"
  calib_dir: "data/calibration"   # 标定拍摄的图片归档目录
  log_dir: "logs"

# ---------------------------------------------------------------------------
logging:
  level: "INFO"
