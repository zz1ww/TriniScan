camera:
  index: 1
  backend: msmf
  width: 1920
  height: 1080
  fourcc: MJPG
  fps: 30
  auto_exposure: false
  exposure: -6
  gain: 0
  auto_wb: false
  discard_frames: 3
turntable:
  port: COM9
  baudrate: 115200
  steps_per_rev: 200
  microstep: 32
  gear_ratio: 5.18
  settle_ms: 200
  timeout_s: 5.0
scan:
  angle_step_deg: 2.0
  num_views: 180        # 视角数，可选 180/150/120/90/60（转角自动=360/n）
  timeout_s: 60
calibration:
  camera_file: software/config/calib_camera.npz
  laser_file: software/config/calib_laser.npz
  axis_file: software/config/calib_axis.npz
  strict: false
camera_calib:
  pattern_cols: 11
  pattern_rows: 8
  square_size_m: 0.01
  images_glob: assets/calibration_targets/chessboard/*.png
  use_sb: true          # 优先用 sector-based 检测器（精度更高，旧版 OpenCV 自动回退）
  auto_prune: true      # 自动剔除重投影误差过大的坏图
  min_images_for_pruning: 8   # 视角少于该数时不做自动剔除
axis_calib:
  sphere_radius_m: 0.02
  method: sphere
  num_views: 12
  step_deg: 30.0
  min_views: 3
  settle_ms: 250
  spot_threshold: 60.0
  spot_win_px: 25
  min_radius_px: 8.0
  max_radius_px: 240.0
  robust: true
  archive_dir: data/calibration/axis
laser_calib:
  robust: true
  robust_method: irls
  view_reject_mm: 1.0
  outlier_mm: 0.5
laser:
  wavelength_nm: 650
  power_mw: 1.0
  safety_class: 2
quality:
  camera_rms_good: 0.30
  camera_rms_warn: 0.50
  laser_rms_good: 0.30
  laser_rms_warn: 0.50
  axis_rms_good: 0.10
  axis_rms_warn: 0.30
extraction:
  method: steger        # steger(最准/慢) | gray_centroid(均衡) | parabola(最快) | peak(最粗)
  threshold: 60.0
  smooth_sigma: 1.5
  steger_sigma: 1.5
  steger_merge: normal
  steger_min_sep_px: 1.0
  min_pixels: 1
  min_points: 50
  invert: false
  roi: null
reconstruction:
  voxel_size: 0.0005
  icp_refine: true
  global_align: true
  pose_graph: true
  edge_span: 3
  iterative_iters: 3
  poisson_depth: 9
  adaptive_depth: true
  orient_max_nn: 30
  density_quantile: 0.02
  close_fallback: bottom_plane
  allow_convex_hull: true
  remove_turntable: true
  turntable_plane_tol_m: 0.001
  turntable_min_inlier: 0.15
  turntable_align_tol_deg: 15.0
  turntable_margin_m: 0.0005
  turntable_band_below_m: 0.0015
  turntable_keep_upper_only: true
  turntable_radius_m: null
volume:
  method: divergence
  voxel_pitch: 0.001
  cross_check: true
  unit: cm3
output:
  raw_dir: data/raw
  pointcloud_dir: data/pointclouds
  mesh_dir: data/meshes
  result_dir: data/results
  calib_dir: data/calibration
  log_dir: logs
logging:
  level: INFO
