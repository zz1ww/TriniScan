camera:
  index: 1
  backend: msmf
  width: 1920
  height: 1080
  fourcc: MJPG
  fps: 30
  auto_exposure: false
  exposure: -6
  gain: 0
  auto_wb: false
  discard_frames: 3
turntable:
  port: COM9
  baudrate: 115200
  steps_per_rev: 200
  microstep: 32
  gear_ratio: 5.18
  settle_ms: 200
  timeout_s: 5.0
scan:
  angle_step_deg: 2.0
  num_views: 180        # 视角数，可选 180/150/120/90/60（转角自动=360/n）
  timeout_s: 60
calibration:
  camera_file: software/config/calib_camera.npz
  laser_file: software/config/calib_laser.npz
  axis_file: software/config/calib_axis.npz
  # 转轴来源：z_axis(默认,不标定,假设相机系Z轴) | calibrated(用 axis_file)
  # 成熟开源转台扫描器通行做法：转台轴=物理竖直轴，不标定即可；
  # 若需严格物理竖直，改用 calibrated 并保证轴标定可靠。
  axis_mode: z_axis
  z_axis_point: [0.0, 0.0, 0.0]   # z_axis 模式下轴上一点（相机系）
  z_axis_dir: [0.0, 0.0, 1.0]     # z_axis 模式下的轴方向（相机系）
  strict: false
camera_calib:
  pattern_cols: 11
  pattern_rows: 8
  square_size_m: 0.01
  images_glob: assets/calibration_targets/chessboard/*.png
  use_sb: true          # 优先用 sector-based 检测器（精度更高，旧版 OpenCV 自动回退）
  auto_prune: true      # 自动剔除重投影误差过大的坏图
  min_images_for_pruning: 8   # 视角少于该数时不做自动剔除
axis_calib:
  sphere_radius_m: 0.02
  # peak: 暗环境下激光打在标记球上的**最亮斑点**做亚像素质心（推荐，稳健）
  # sphere: 亮背景下检测黑球轮廓反求球心（依赖 Hough，环境光下易失败）
  method: peak
  save_images: true       # 强制保存每个角度的原始图，便于复查/复标
  num_views: 12
  step_deg: 30.0
  min_views: 6            # 少于该角度数视为标定失败
  max_residual_mm: 1.0    # 圆拟合残差 RMS 上限(mm)，超过判为失败
  min_radius_mm: 2.0      # 拟合圆半径下限(mm)，过小说明点挤在一起(坏标定)
  settle_ms: 250
  spot_threshold: 60.0
  spot_win_px: 25
  min_radius_px: 8.0
  max_radius_px: 240.0
  robust: true
  archive_dir: data/calibration/axis
laser_calib:
  robust: true
  robust_method: irls
  view_reject_mm: 1.0
  outlier_mm: 0.5
laser:
  wavelength_nm: 650
  power_mw: 1.0
  safety_class: 2
quality:
  camera_rms_good: 0.30
  camera_rms_warn: 0.50
  laser_rms_good: 0.30
  laser_rms_warn: 0.50
  axis_rms_good: 0.10
  axis_rms_warn: 0.30
extraction:
  method: row_peak     # 默认逐行（竖直线激光最优；对零散亮点免疫）
  # row_peak(逐行峰值+抛物线,默认) | row_centroid(逐行重心)
  # steger(最准/慢) | gray_centroid(逐列均衡) | parabola(逐列最快) | peak(逐列最粗)
  threshold: 60.0
  smooth_sigma: 1.5
  subpixel: true       # row_peak 是否做抛物线亚像素插值
  steger_sigma: 1.5
  steger_merge: normal
  steger_min_sep_px: 1.0
  min_pixels: 1
  min_points: 50
  invert: false
  roi: null
reconstruction:
  voxel_size: 0.0005
  icp_refine: false     # 角度已知的转台：不做 ICP/位姿图，纯几何旋转拼接
  global_align: true
  pose_graph: true
  edge_span: 3
  iterative_iters: 3
  # --- 物理边界过滤（剔除环境光/反光远点，"飞碟"主因）---
  depth_filter: true    # 三角测量后按相机系深度剔除远点
  depth_min_m: 0.0      # 深度下限(m)，0=不限
  depth_max_m: 0.30     # 深度上限(m)；本物体约0.17~0.28m，远点0.29~0.37m
  bounds_radius_m: 0.0  # 世界系距轴半径上限(m)，0=不限（建议设为转台半径）
  bounds_z_min_m: null  # 世界系沿轴坐标下限(m)，null=不限
  bounds_z_max_m: null  # 世界系沿轴坐标上限(m)，null=不限
  poisson_depth: 9
  adaptive_depth: true
  orient_max_nn: 30
  density_quantile: 0.02
  close_fallback: bottom_plane
  allow_convex_hull: true
  remove_turntable: true
  turntable_plane_tol_m: 0.001
  turntable_min_inlier: 0.15
  turntable_align_tol_deg: 15.0
  turntable_margin_m: 0.0005
  turntable_band_below_m: 0.0015
  turntable_keep_upper_only: true
  turntable_radius_m: null
volume:
  method: divergence
  voxel_pitch: 0.001
  cross_check: true
  unit: cm3
output:
  raw_dir: data/raw
  pointcloud_dir: data/pointclouds
  mesh_dir: data/meshes
  result_dir: data/results
  calib_dir: data/calibration
  log_dir: logs
logging:
  level: INFO
